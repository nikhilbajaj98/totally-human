<!DOCTYPE html>
<html lang="en-US">
<head>
  <link rel="canonical" href="https://www.amazon.com/Sample-Brand-Echo-Dot-5th/dp/B0TESTPROD" />
  <meta property="og:title" content="Echo Dot (5th Gen) | Smart speaker with Alexa" />
  <meta property="og:image" content="https://m.media-amazon.com/images/I/81og-primary.jpg" />
</head>
<body>
  <input type="hidden" id="ASIN" name="ASIN" value="B0TESTPROD" />

  <span id="productTitle" class="a-size-large product-title-word-break">
    Echo Dot (5th Gen, 2022 release) | Smart speaker with Alexa | Charcoal
  </span>

  <div id="corePrice_feature_div">
    <span class="a-price" data-a-size="xl" data-a-color="base">
      <span class="a-offscreen">$49.99</span>
      <span aria-hidden="true"><span class="a-price-symbol">$</span><span class="a-price-whole">49</span><span class="a-price-fraction">99</span></span>
    </span>
  </div>

  <div id="averageCustomerReviews">
    <span id="acrPopover" class="reviewCountTextLinkedHistogram" title="4.6 out of 5 stars">
      <span class="a-declarative" data-action="acrStarsLink-click-metrics">
        <i class="a-icon a-icon-star a-star-4-5"><span class="a-icon-alt">4.6 out of 5 stars</span></i>
      </span>
    </span>
    <span id="acrCustomerReviewText" class="a-size-base">12,347 ratings</span>
  </div>

  <div id="availability" class="a-section a-spacing-base">
    <span class="a-size-medium a-color-success"> In Stock </span>
  </div>

  <div id="feature-bullets" class="a-section a-spacing-medium a-spacing-top-small">
    <ul class="a-unordered-list a-vertical a-spacing-mini">
      <li><span class="a-list-item">Our most popular smart speaker with Alexa</span></li>
      <li><span class="a-list-item">Improved audio for richer sound in any room</span></li>
      <li><span class="a-list-item">Voice control for music, news, and compatible smart home</span></li>
    </ul>
  </div>

  <div id="imgTagWrapperId" class="imgTagWrapper">
    <img id="landingImage"
         alt="Echo Dot product image"
         src="https://m.media-amazon.com/images/I/71landing-main.jpg"
         data-a-dynamic-image="{&quot;https://m.media-amazon.com/images/I/71landing-main.jpg&quot;:[600,600],&quot;https://m.media-amazon.com/images/I/81alt-thumb.jpg&quot;:[500,500]}" />
  </div>
</body>
</html>
